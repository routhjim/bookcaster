[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-reader"
version = "0.1.0"
description = "Bookcaster: turn a book into a full-cast audiobook with music, sound effects and video, on local models. Includes the tts-reader voice engine layer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "piper-tts>=1.6.0",
    "lameenc>=1.7.0",
    "mutagen>=1.47.0",
    "Pillow>=10.0",          # tools/remake_chapter.py + ltx_flow (the LTX video flow) draw/crop in-process
]

[project.scripts]
tts-reader = "tts_reader.cli:main"
bookcaster = "tts_reader.bookcaster:main"

[tool.setuptools]
packages = ["tts_reader"]
